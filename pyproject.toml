[project]
name = "anonybot"
version = "0.1.0"
description = "Allows users to send messages anonymously to a channel (and Bucket)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11.13,<4",
    "discord-py>=2.5.2,<3",
    "openai>=3.26.0,<4",
    "python-dotenv>=0.15.0",
    "replicate>=1.0.7,<2",
    "requests>=2.31.0,<3",
    "text-to-owo>=2.0.1,<3",
    "tzdata>=2026.3",
]

[tool.uv]
package = false
